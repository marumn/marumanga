<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Schedule</title>
  <style>
    body {
  font-family: Arial, sans-serif;
  background-color: #0f0f0f;
  color: white;
  margin: 0;
  padding: 20px;
  max-width: 100%;
  overflow-x: hidden;
  box-sizing: border-box;
}

    h1 {
      text-align: center;
      color: #ff2e63;
    }

    .schedule {
  width: 100%;
  max-width: 600px;
  margin: 0 auto;
}

    .day {
      background: #1a1a1a;
      padding: 15px;
      margin-bottom: 10px;
      border-radius: 8px;
    }

    .day h2 {
      margin: 0 0 10px;
      color: #ff2e63;
    }

    ul {
      padding-left: 20px;
      margin: 0;
    }

    li {
      margin-bottom: 5px;
    }

    .back-btn {
      display: block;
      width: 200px;
      margin: 20px auto;
      text-align: center;
      padding: 10px;
      background: #ff2e63;
      color: white;
      text-decoration: none;
      border-radius: 6px;
    }

    .back-btn:hover {
      background: #e02555;
    }

   header {
  background: #111; /* same dark bar effect */
  padding: 15px;
  text-align: center;
  border-bottom: 1px solid #1f1f2e;
}

.header-content {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
}

header img {
  width: 60px;
  height: auto;
}

    * {
  box-sizing: border-box;
}

body {
  max-width: 100%;
  overflow-x: hidden;
}

    @media (max-width: 768px) {
  body {
    padding: 10px;
  }

 .schedule {
  width: 100%;
  max-width: 100%;
  margin: 0;
  padding: 0 5px;
}
  .day {
    padding: 12px;
  }

  h1 {
    font-size: 22px;
  }

  .header-content {
    flex-direction: row;
    gap: 8px;
  }

  .logo {
    width: 45px;
  }

      .day {
  margin-left: 0;
  margin-right: 0;
  border-radius: 10px;
}
}
  </style>
</head>
<body>
  
<header onclick="goHome()" style="cursor:pointer;">
  <div class="header-content">
    <img src="logo.png" alt="Maru Manhwa Logo" class="logo">
    <h1>Maru Manhwa</h1>
  </div>
</header>
  
<h1>📅 Манхва Schedule</h1>

<div class="schedule">

  <div class="day">
    <h2>Даваа (Monday)</h2>
    <ul>
      <li>Manhwa 1</li>
      <li>Manhwa 2</li>
    </ul>
  </div>

  <div class="day">
    <h2>Мягмар (Tuesday)</h2>
    <ul>
      <li>Manhwa 3</li>
    </ul>
  </div>

  <div class="day">
    <h2>Лхагва (Wednesday)</h2>
    <ul>
      <li>Manhwa 4</li>
    </ul>
  </div>

  <div class="day">
    <h2>Пүрэв (Thursday)</h2>
    <ul>
      <li>Manhwa 5</li>
    </ul>
  </div>

  <div class="day">
    <h2>Баасан (Friday)</h2>
    <ul>
      <li>Manhwa 6</li>
    </ul>
  </div>

  <div class="day">
    <h2>Бямба (Saturday)</h2>
    <ul>
      <li>Manhwa 7</li>
    </ul>
  </div>

  <div class="day">
    <h2>Ням (Sunday)</h2>
    <ul>
      <li>Manhwa 8</li>
    </ul>
  </div>

</div>

<a href="index.html" class="back-btn">⬅ Буцах</a>

  <script>
  function goHome() {
    window.location.href = "index.html";
  }
</script>
  
</body>
</html>
