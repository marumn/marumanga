<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <title>Schedule</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #0f0f0f;
      color: white;
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
      color: #ff2e63;
    }

    .schedule {
      max-width: 600px;
      margin: auto;
    }

    .day {
      background: #1a1a1a;
      padding: 15px;
      margin-bottom: 10px;
      border-radius: 8px;
    }

    .day h2 {
      margin: 0 0 10px;
      color: #ff2e63;
    }

    ul {
      padding-left: 20px;
      margin: 0;
    }

    li {
      margin-bottom: 5px;
    }

    .back-btn {
      display: block;
      width: 200px;
      margin: 20px auto;
      text-align: center;
      padding: 10px;
      background: #ff2e63;
      color: white;
      text-decoration: none;
      border-radius: 6px;
    }

    .back-btn:hover {
      background: #e02555;
    }
  </style>
</head>
<body>

<h1>📅 Манхва Schedule</h1>

<div class="schedule">

  <div class="day">
    <h2>Даваа (Monday)</h2>
    <ul>
      <li>Manhwa 1</li>
      <li>Manhwa 2</li>
    </ul>
  </div>

  <div class="day">
    <h2>Мягмар (Tuesday)</h2>
    <ul>
      <li>Manhwa 3</li>
    </ul>
  </div>

  <div class="day">
    <h2>Лхагва (Wednesday)</h2>
    <ul>
      <li>Manhwa 4</li>
    </ul>
  </div>

  <div class="day">
    <h2>Пүрэв (Thursday)</h2>
    <ul>
      <li>Manhwa 5</li>
    </ul>
  </div>

  <div class="day">
    <h2>Баасан (Friday)</h2>
    <ul>
      <li>Manhwa 6</li>
    </ul>
  </div>

  <div class="day">
    <h2>Бямба (Saturday)</h2>
    <ul>
      <li>Manhwa 7</li>
    </ul>
  </div>

  <div class="day">
    <h2>Ням (Sunday)</h2>
    <ul>
      <li>Manhwa 8</li>
    </ul>
  </div>

</div>

<a href="index.html" class="back-btn">⬅ Буцах</a>

</body>
</html>
